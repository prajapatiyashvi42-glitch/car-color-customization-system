{% extends 'base.html' %}
{% block content %}
<div class="d-flex" style="min-height:calc(100vh - 56px);">
    {% include 'admin/sidebar.html' %}
    <div class="flex-grow-1 p-4 bg-light">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">🏷️ Car Brands</h4>
            <a href="{% url 'admin_brand_add' %}" class="btn btn-danger btn-sm">+ Add Brand</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr><th>#</th><th>Brand Name</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody>
                        {% for b in brands %}
                        <tr>
                            <td class="text-muted">{{ b.brand_id }}</td>
                            <td class="fw-semibold">{{ b.brand_name }}</td>
                            <td class="text-end">
                                <a href="{% url 'admin_brand_edit' b.brand_id %}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
                                <a href="{% url 'admin_brand_delete' b.brand_id %}" class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="3" class="text-center text-muted py-4">No brands yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
