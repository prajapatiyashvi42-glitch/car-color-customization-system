{% extends 'base.html' %}
{% block content %}
<div class="d-flex" style="min-height:calc(100vh - 56px);">
    {% include 'admin/sidebar.html' %}
    <div class="flex-grow-1 p-4 bg-light d-flex align-items-start">
        <div class="card border-0 shadow-sm p-4 mt-2" style="max-width:480px;width:100%;border-radius:14px;">
            <h5 class="fw-bold mb-4">🔒 Change Admin Password</h5>

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Current Password</label>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" name="new_password" class="form-control" minlength="6" required>
                    <div class="form-text">Minimum 6 characters.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger fw-bold px-4">Update Password</button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
